# 検品ラインのランキング API。HTTP API → Lambda → DynamoDB（1 テーブル）。
#
# 方針
# ・依存パッケージは足さない。@aws-sdk は nodejs22.x の実行環境に同梱のものを使う
# ・CORS は AllowedOrigin ちょうど一つだけ。ワイルドカードにしない
# ・スロットリングを低めに置く。個人の練習サイトのランキングなので、毎秒数件で足りる。
#   低くしておけば、叩かれたときの請求額にも上限がかかる
# ・DynamoDB はオンデマンド課金＋PITR。消えたら戻せないのはランキングでも困る
# ・TokenPepper は NoEcho。32 字未満（ダミーの CHANGE_ME を含む）はデプロイ時点で弾く
# ・テーブル名の既定は oyayubi-dojo-kenpin。回転ずしのとき（oyayubi-dojo-ranking）から名前を変えたのは、
#   GSI の写す属性（Projection）を変えたため。CloudFormation は既存の GSI の中身を書き換えられず、
#   一回の更新で作る・消すのも索引一つまで（server/README.md「回転ずしからの移行」）。
#   名前を変えると表ごと作り直しになり、一回のデプロイで済む。古い表は Retain なので残る
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: oyayubi-dojo 検品ラインランキング

Parameters:
  TableName:
    Type: String
    Default: oyayubi-dojo-kenpin
    AllowedPattern: '^[A-Za-z0-9_.-]{3,255}$'
  AllowedOrigin:
    Type: String
    Description: 遊び場のオリジン（例 https://<ユーザー名>.github.io）。末尾スラッシュ無し
    AllowedPattern: '^https://[^/]+$'
  TokenPepper:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: token のハッシュに混ぜる秘密。32 字以上の乱数（openssl rand -base64 48 など）

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
        - { AttributeName: GSI2PK, AttributeType: S }
        - { AttributeName: GSI2SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      # どの索引も、自己ベストのアイテムのうち片方にだけ載る（もう一方のキーを持たない）。
      # PROFILE はどちらのキーも持たないので、token のハッシュは索引に載らない。
      # 写すのは全部（ALL）。自己ベストのアイテムには順位表に出す値しか無く、
      # INCLUDE で名前を並べると、出す列を一つ足すたびに表を作り直すことになる（GSI の Projection は後から変えられない）
      GlobalSecondaryIndexes:
        # コースごとの総合の表（毎分の順、各人の毎分の自己ベスト一行）
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL
        # コースごとの部門の表（親指シフト・ローマ字それぞれ点数の順、各人の点数の自己ベスト一行）
        - IndexName: GSI2
          KeySchema:
            - { AttributeName: GSI2PK, KeyType: HASH }
            - { AttributeName: GSI2SK, KeyType: RANGE }
          Projection:
            ProjectionType: ALL

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 5

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          TOKEN_PEPPER: !Ref TokenPepper
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref Table
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Events:
        PostPlayers:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /players }
        PostScores:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: POST, Path: /scores }
        GetRanking:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: GET, Path: /ranking }
        DeleteMe:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Method: DELETE, Path: /players/me }

  # ログを無期限に溜めない
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: assets/js/game/config.js の RANKING_API_URL に入れる値
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
